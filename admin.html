<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ระบบจัดการหลังบ้าน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 flex h-screen overflow-hidden">

    <!-- Sidebar หลังบ้าน -->
    <aside class="w-64 bg-indigo-900 text-white hidden md:flex flex-col">
        <div class="p-5 text-xl font-bold border-b border-indigo-800">⚙️ Admin Control</div>
        <nav class="flex-grow p-4 space-y-2">
            <a href="#" class="block px-4 py-2 rounded bg-indigo-800 font-medium">Dashboard</a>
            <a href="index.html" class="block px-4 py-2 rounded hover:bg-indigo-800 text-indigo-200">กลับสู่หน้าเว็บไซต์</a>
        </nav>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-grow flex flex-col h-full overflow-y-auto">
        <header class="bg-white shadow p-4 flex justify-between items-center">
            <h1 class="text-lg font-bold">Dashboard ภาพรวมระบบร้านค้า</h1>
            <span class="text-sm bg-green-100 text-green-700 px-3 py-1 rounded-full font-medium">สถานะ: เชื่อมต่อ GitHub ออนไลน์</span>
        </header>

        <div class="p-6 space-y-6 max-w-7xl w-full mx-auto">
            <!-- สถิติเบื้องต้น (Cards) -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-xl shadow">
                    <p class="text-sm text-gray-500">ยอดขายรวมเดือนนี้</p>
                    <h3 class="text-2xl font-bold text-indigo-600 mt-1">฿45,200</h3>
                </div>
                <div class="bg-white p-5 rounded-xl shadow">
                    <p class="text-sm text-gray-500">ออเดอร์ใหม่</p>
                    <h3 class="text-2xl font-bold text-green-600 mt-1">12 รายการ</h3>
                </div>
                <div class="bg-white p-5 rounded-xl shadow">
                    <p class="text-sm text-gray-500">สินค้าในระบบ</p>
                    <h3 class="text-2xl font-bold text-blue-600 mt-1">2 รายการ</h3>
                </div>
            </div>

            <!-- กราฟสถิติ (Dashboard Chart) -->
            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="font-bold mb-4">สถิติยอดขายย้อนหลัง</h3>
                <div class="h-64">
                    <canvas id="salesChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script>
        const ctx = document.getElementById('salesChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['สัปดาห์ที่ 1', 'สัปดาห์ที่ 2', 'สัปดาห์ที่ 3', 'สัปดาห์ที่ 4'],
                datasets: [{
                    label: 'ยอดขาย (บาท)',
                    data: [12000, 19000, 15000, 28000],
                    borderColor: '#4f46e5',
                    backgroundColor: 'rgba(79, 70, 229, 0.1)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    </script>
</body>
</html>
