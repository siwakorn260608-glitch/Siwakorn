<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storefront - ร้านค้าออนไลน์</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 2rem 1rem;
        }
        header h1 {
            margin: 0;
            font-size: 2rem;
        }
        header p {
            color: #aaa;
            margin-top: 0.5rem;
        }
        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }
        .product-card {
            background: #fff;
            border-radius: 8px;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .product-card h3 {
            margin: 0.5rem 0;
            font-size: 1.2rem;
        }
        .price {
            color: #e44d26;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
        .btn {
            display: inline-block;
            background-color: #222;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #e44d26;
        }
        footer {
            text-align: center;
            padding: 1.5rem;
            color: #777;
            font-size: 0.9rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>ยินดีต้อนรับสู่ร้านค้าของเรา</h1>
        <p>แหล่งรวมสินค้าคุณภาพ คัดสรรมาเพื่อคุณ</p>
    </header>

    <div class="container">
        <div class="products-grid">
            <!-- สินค้าตัวอย่างที่ 1 -->
            <div class="product-card">
                <h3>สินค้าตัวอย่างที่ 1</h3>
                <p class="price">฿ 290</p>
                <a href="#" class="btn">สั่งซื้อสินค้า</a>
            </div>
            <!-- สินค้าตัวอย่างที่ 2 -->
            <div class="product-card">
                <h3>สินค้าตัวอย่างที่ 2</h3>
                <p class="price">฿ 390</p>
                <a href="#" class="btn">สั่งซื้อสินค้า</a>
            </div>
            <!-- สินค้าตัวอย่างที่ 3 -->
            <div class="product-card">
                <h3>สินค้าตัวอย่างที่ 3</h3>
                <p class="price">฿ 490</p>
                <a href="#" class="btn">สั่งซื้อสินค้า</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Storefront. All rights reserved.</p>
    </footer>

</body>
</html>
